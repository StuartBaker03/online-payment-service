{% extends 'payapp/base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Create Admin Account
{% endblock %}

{% block content %}
    <p><a href="{% url 'admin_home' %}" class="btn btn-success">Return to Admin Home</a></p>
    <h1>Register Admin</h1>
    <form method="post" class="form-group">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Register Admin</button>
    </form>
{% endblock %}
